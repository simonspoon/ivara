<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0d1117"/>

  <!-- Arrow outline — dark -->
  <rect x="1" y="2" width="3" height="1" fill="#134e4a"/>
  <rect x="1" y="3" width="5" height="1" fill="#134e4a"/>
  <rect x="1" y="4" width="7" height="1" fill="#134e4a"/>
  <rect x="1" y="5" width="9" height="1" fill="#134e4a"/>
  <rect x="1" y="6" width="11" height="1" fill="#134e4a"/>
  <rect x="0" y="7" width="15" height="2" fill="#134e4a"/>
  <rect x="1" y="9" width="11" height="1" fill="#134e4a"/>
  <rect x="1" y="10" width="9" height="1" fill="#134e4a"/>
  <rect x="1" y="11" width="7" height="1" fill="#134e4a"/>
  <rect x="1" y="12" width="5" height="1" fill="#134e4a"/>
  <rect x="1" y="13" width="3" height="1" fill="#134e4a"/>

  <!-- Arrow fill — teal -->
  <rect x="2" y="3" width="3" height="1" fill="#2dd4bf"/>
  <rect x="2" y="4" width="5" height="1" fill="#2dd4bf"/>
  <rect x="2" y="5" width="7" height="1" fill="#2dd4bf"/>
  <rect x="2" y="6" width="9" height="1" fill="#2dd4bf"/>
  <rect x="1" y="7" width="13" height="2" fill="#2dd4bf"/>
  <rect x="2" y="9" width="9" height="1" fill="#2dd4bf"/>
  <rect x="2" y="10" width="7" height="1" fill="#2dd4bf"/>
  <rect x="2" y="11" width="5" height="1" fill="#2dd4bf"/>
  <rect x="2" y="12" width="3" height="1" fill="#2dd4bf"/>

  <!-- Upper-left highlight -->
  <rect x="2" y="3" width="2" height="1" fill="#5eead4"/>
  <rect x="2" y="4" width="3" height="1" fill="#5eead4"/>
  <rect x="2" y="5" width="4" height="1" fill="#5eead4"/>
  <rect x="2" y="6" width="4" height="1" fill="#5eead4"/>

  <!-- Inner edge — darker teal for depth -->
  <rect x="4" y="6" width="5" height="1" fill="#0d9488"/>
  <rect x="3" y="7" width="8" height="2" fill="#0d9488"/>
  <rect x="4" y="9" width="5" height="1" fill="#0d9488"/>

  <!-- Arrowhead tip — bright point -->
  <rect x="12" y="7" width="2" height="2" fill="#99f6e4"/>
  <rect x="13" y="7" width="1" height="2" fill="#ccfbf1"/>

  <!-- Speed lines — trailing motion -->
  <rect x="0" y="4" width="1" height="1" fill="#134e4a"/>
  <rect x="0" y="11" width="1" height="1" fill="#134e4a"/>
</svg>
